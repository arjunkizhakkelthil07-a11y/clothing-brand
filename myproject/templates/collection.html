<!DOCTYPE html>
<html>
<head>
    <title>Collection</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        /* Header */
        h1 {
            text-align: center;
            padding: 30px 0;
            font-size: 40px;
            letter-spacing: 2px;
        }

        /* Product Grid */
        .product-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            padding: 20px 50px 50px;
        }

        /* Card */
        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: 0.3s ease;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        /* Image */
        .card img {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
        }

        /* Content */
        .card h3 {
            margin: 15px 0 5px;
            font-size: 20px;
        }

        .card p {
            color: #ff4d4d;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* Button */
        .card button {
            margin-bottom: 20px;
            padding: 10px 20px;
            border: none;
            background: black;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
        }

        .card button:hover {
            background: #ff4d4d;
        }

        /* Responsive */
        @media(max-width: 600px) {
            h1 {
                font-size: 28px;
            }
        }

    </style>
</head>

<body>

<h1>Our Collection</h1>

<div class="product-container">
    {% for product in products %}
    <div class="card">
        {% if product.image %}
            <img src="{{ product.image.url }}" alt="{{ product.name }}">
        {% else %}
            <p>No image available</p>
        {% endif %}
        <h3>{{ product.name }}</h3>
        <p>₹{{ product.price }}</p>
        <p>{{product.description}}</p>
        <button>View Product</button>
    </div>
    {% endfor %}
</div>

</body>
</html>
