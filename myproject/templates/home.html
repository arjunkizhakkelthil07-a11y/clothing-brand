<!DOCTYPE html>
<html>
<head>
    <title>Clothing Brand</title>
</head>
<body>

<h1>Clothing Store</h1>
<a href="/cart/">Go to Cart</a>

<hr>

{% for product in products %}
    <div>
        <img src="{{ product.image.url }}" width="200">
        <h3>{{ product.name }}</h3>
        <p>₹{{ product.price }}</p>
    </div>
    <hr>
{% endfor %}

</body>
</html>
